{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
    <div class="container" style="justify-content: flex-start; padding-left: 5em;">
        <main>
            <section class="galeria" style="max-width: 400px; width: 100%;">
                <h1 class="form-title" style="color: #333; text-align: center; margin-bottom: 20px;">Cadastro</h1>
                <form action="{% url 'register' %}" method="POST">
                    {% csrf_token %}
                    <div class="row">
                        {% for field in form.visible_fields %}
                        <div class="col-12 col-lg-12" style="margin-bottom: 10px;">
                            <label for="{{ field.id_for_label }}" style="color:#555; font-weight: bold; margin-bottom: 5px; display: block;">
                                {{ field.label }}
                            </label>
                            {{ field }}
                        </div>
                        {% endfor %}
                    </div>
                    <div>
                        <button class="btn btn-success col-12" style="padding-top: 5px; padding-bottom: 5px;" type="submit">
                            Cadastrar
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
